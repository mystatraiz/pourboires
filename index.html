<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Calculateur de pourboires – Local</title>
<style>
/* styles identiques à la version précédente */
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>Calculateur local de pourboires</h1>
</header>
<section class="card">
<div class="controls">
<div class="field half">
<label for="total">Montant total à répartir (€)</label>
<input id="total" type="number" min="0" step="1" value="0" />
</div>
<div class="field half">
<label for="rounding">Méthode d'arrondi</label>
<select id="rounding">
<option value="floor">Au plus bas (Hamilton)</option>
<option value="nearest">Au plus proche</option>
</select>
</div>
</div>
<div class="toolbar">
<button id="addRow">+ Ajouter un serveur</button>
</div>
<table id="tbl">
<thead>
<tr>
<th>Nom</th>
<th>Points</th>
<th>Jours</th>
<th>Montant fixe (€)</th>
<th>Pondération</th>
<th>Montant (€)</th>
<th>×</th>
</tr>
</thead>
<tbody></tbody>
</table>
<div>Total pondération: <span id="sumW">0</span> | Somme distribuée: <span id="sum€">0</span> | Reste: <span id="rest">0</span></div>
</section>
</div>
<template id="rowTpl">
<tr>
<td><input type="text" class="name" placeholder="Nom" /></td>
<td><input type="number" class="points" min="0" step="1" value="0" /></td>
<td><input type="number" class="days" min="0" step="1" value="0" /></td>
<td><input type="number" class="fixed" min="0" step="1" value="0" /></td>
<td><span class="weight">0</span></td>
<td><span class="amount">0</span></td>
<td><button class="del">Suppr</button></td>
</tr>
</template>
<script>
const tblBody=document.querySelector('#tbl tbody');
const rowTpl=document.querySelector('#rowTpl');
function addRow(data={name:'',points:0,days:0,fixed:0}){
  const node=rowTpl.content.firstElementChild.cloneNode(true);
  const name=node.querySelector('.name');
  const points=node.querySelector('.points');
  const days=node.querySelector('.days');
  const fixed=node.querySelector('.fixed');
  const weight=node.querySelector('.weight');
  const amount=node.querySelector('.amount');
  name.value=data.name;points.value=data.points;days.value=data.days;fixed.value=data.fixed;
  function update(){
    weight.textContent=(parseInt(points.value)||0)*(parseInt(days.value)||0);
    compute();
  }
  [name,points,days,fixed].forEach(inp=>inp.addEventListener('input',update));
  node.querySelector('.del').addEventListener('click',()=>{node.remove();compute();});
  tblBody.appendChild(node);
  update();
}
function getRows(){
  return Array.from(tblBody.querySelectorAll('tr')).map(tr=>(
    {
      name:tr.querySelector('.name').value.trim()||'—',
      points:parseInt(tr.querySelector('.points').value)||0,
      days:parseInt(tr.querySelector('.days').value)||0,
      fixed:parseInt(tr.querySelector('.fixed').value)||0,
      el:tr
    }
  ));
}
function compute(){
  const total=parseInt(document.querySelector('#total').value)||0;
  const rounding=document.querySelector('#rounding').value;
  const rows=getRows();
  const weights=rows.map(r=>Math.max(0,r.points*r.days));
  const fixedTotal=rows.reduce((a,b)=>a+b.fixed,0);
  const sumW=weights.reduce((a,b)=>a+b,0);
  document.querySelector('#sumW').textContent=sumW;
  let restTotal=total-fixedTotal;
  if(restTotal<0) restTotal=0;
  let distributed=0;
  const rawShares=rows.map((r,i)=> restTotal * (weights[i]/(sumW||1)));
  let amounts=[];
  if(rounding==='nearest'){
    amounts=rawShares.map(v=>Math.round(v));
    let delta=restTotal-amounts.reduce((a,b)=>a+b,0);
    const order=rawShares.map((v,i)=>({i,frac:v-Math.round(v)})).sort((a,b)=>(delta>0)?b.frac-a.frac:a.frac-b.frac);
    for(let k=0;delta!==0&&k<order.length;k++){amounts[order[k].i]+=(delta>0?1:-1);delta+=(delta>0?-1:1);}
  } else {
    const floors=rawShares.map(v=>Math.floor(v));
    let rest=restTotal-floors.reduce((a,b)=>a+b,0);
    const order=rawShares.map((v,i)=>({i,frac:v-Math.floor(v)})).sort((a,b)=>b.frac-a.frac);
    amounts=floors.slice();
    for(let k=0;k<order.length&&rest>0;k++){amounts[order[k].i]+=1;rest--;}
  }
  rows.forEach((r,i)=>{
    const finalAmt=r.fixed+amounts[i];
    r.el.querySelector('.amount').textContent=finalAmt;
    distributed+=finalAmt;
  });
  document.querySelector('#sum€').textContent=distributed;
  document.querySelector('#rest').textContent=Math.max(0,total-distributed);
}
document.querySelector('#addRow').addEventListener('click',()=>addRow());
addRow();
</script>
</body>
</html>
